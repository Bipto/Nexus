name: Build (Emscripten)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  build-emscripten:
    name: Build (Emscripten - ${{ matrix.build_type }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        build_type:
          - Release
          - Debug

    env:
      EM_VERSION: 6.0.5
      EM_CACHE_FOLDER: emsdk-cache
      WABT_VERSION: 1.0.42

    steps:
      # ===========================================================
      # Checkout
      # ===========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ===========================================================
      # Emscripten cache
      # ===========================================================

      - name: Restore Emscripten cache
        uses: actions/cache@v4
        with:
          path: ${{ env.EM_CACHE_FOLDER }}
          key: >-
            emscripten-${{ runner.os }}-${{ env.EM_VERSION }}
          restore-keys: |
            emscripten-${{ runner.os }}-

      # ===========================================================
      # Setup Emscripten
      # ===========================================================

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}

      # ===========================================================
      # Toolchain diagnostics
      # ===========================================================

      - name: Show toolchain versions
        shell: pwsh
        run: |
          Write-Host "=== Emscripten ==="
          emcc --version

          Write-Host "=== Node.js ==="
          node --version

          Write-Host "=== Python ==="
          python --version

          Write-Host "=== CMake ==="
          cmake --version

          Write-Host "=== Ninja ==="
          ninja --version

      # ===========================================================
      # Verify Emscripten compiler
      # ===========================================================

      - name: Test Emscripten compiler
        shell: pwsh
        run: |
          @'
          #include <iostream>

          int main()
          {
              std::cout << "Hello from Emscripten\n";
              return 0;
          }
          '@ | Set-Content format-test.cpp

          em++ `
            -std=c++20 `
            -O0 `
            format-test.cpp `
            -o format-test.html

          $required = @(
            "format-test.html",
            "format-test.js",
            "format-test.wasm"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Expected Emscripten output missing: $file"
            }
          }

      # ===========================================================
      # WABT
      # ===========================================================

      - name: Install WABT
        shell: pwsh
        run: |
          $archive = "wabt-${env:WABT_VERSION}-windows-x64.tar.gz"
          $url = "https://github.com/WebAssembly/wabt/releases/download/${env:WABT_VERSION}/$archive"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $archive

          tar -xzf $archive

          $wabtBin = Join-Path `
            $PWD `
            "wabt-${env:WABT_VERSION}\bin"

          if (-not (Test-Path $wabtBin)) {
            throw "WABT bin directory not found: $wabtBin"
          }

          Add-Content $env:GITHUB_PATH $wabtBin

      - name: Verify WABT
        shell: pwsh
        run: |
          wasm-validate --version

      # ===========================================================
      # CPM cache
      # ===========================================================

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: >-
            cpm-${{ runner.os }}-Emscripten-${{
              hashFiles(
                '**/CMakeLists.txt',
                '**/*.cmake',
                '**/CMakePresets.json'
              )
            }}
          restore-keys: |
            cpm-${{ runner.os }}-Emscripten-

      # ===========================================================
      # Configure
      # ===========================================================

      - name: Configure CMake
        shell: pwsh
        run: |
          emcmake cmake `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" `
            -DCPM_SOURCE_CACHE="${{ github.workspace }}/.cache" `
            -DNX_PLATFORM_OPENGL=1 `
            -DNX_PLATFORM_VULKAN=0 `
            -DNX_PLATFORM_OPENAL=1 `
            -DBUILD_TESTING=ON `
            -S .

      # ===========================================================
      # Build
      # ===========================================================

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel

      # ===========================================================
      # Inspect output
      # ===========================================================

      - name: Inspect WebAssembly output
        shell: pwsh
        run: |
          Write-Host "=== Generated WebAssembly files ==="

          $files = Get-ChildItem `
            -Path build `
            -Recurse `
            -File `
            | Where-Object {
                $_.Extension -in @(
                  ".wasm",
                  ".js",
                  ".html",
                  ".data"
                )
              }

          if ($files.Count -eq 0) {
            throw "No WebAssembly output files were produced."
          }

          $files |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      # ===========================================================
      # Validate WebAssembly
      # ===========================================================

      - name: Validate WebAssembly output
        shell: pwsh
        run: |
          $wasmFiles = Get-ChildItem `
            -Path build `
            -Recurse `
            -Filter *.wasm

          if ($wasmFiles.Count -eq 0) {
            throw "No .wasm files were produced."
          }

          foreach ($wasm in $wasmFiles) {
            Write-Host "Validating $($wasm.FullName)"

            wasm-validate `
              --enable-threads `
              "$($wasm.FullName)"

            if ($LASTEXITCODE -ne 0) {
              throw "wasm-validate failed for $($wasm.FullName)"
            }
          }

      # ===========================================================
      # Show registered tests
      # ===========================================================

      - name: Show CTest tests
        shell: pwsh
        run: |
          ctest `
            --test-dir build `
            -C "${{ matrix.build_type }}" `
            -N

      # ===========================================================
      # Run tests
      # ===========================================================

      - name: Run tests
        shell: pwsh
        run: |
          ctest `
            --test-dir build `
            -C "${{ matrix.build_type }}" `
            --output-on-failure `
            --parallel

      # ===========================================================
      # Upload generated output
      # ===========================================================

      - name: Upload WebAssembly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.build_type }}
          if-no-files-found: error
          path: |
            build/**/*.wasm
            build/**/*.js
            build/**/*.html
            build/**/*.data
