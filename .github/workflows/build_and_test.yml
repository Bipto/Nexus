name: Build and Test (Multi-Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  VCPKG_FEATURE_FLAGS: binarycaching
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

jobs:
  # ============================================================
  # WINDOWS JOB
  # ============================================================
  build-windows:
    name: Build (Windows - ${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # MSVC
          - name: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            vcpkg_triplet: x64-windows

          - name: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Debug
            vcpkg_triplet: x64-windows

          # Clang
          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            vcpkg_triplet: x64-mingw-static

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug
            vcpkg_triplet: x64-mingw-static

          # Clang-CL
          - name: Clang-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Release
            vcpkg_triplet: x64-windows

          - name: Clang-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Debug
            vcpkg_triplet: x64-windows

          # MinGW-UCRT (MSYS2)
          - name: MinGW-UCRT
            c_compiler: ucrt64-w64-mingw32-gcc
            cpp_compiler: ucrt64-w64-mingw32-g++
            build_type: Release
            vcpkg_triplet: x64-mingw-static

          - name: MinGW-UCRT
            c_compiler: ucrt64-w64-mingw32-gcc
            cpp_compiler: ucrt64-w64-mingw32-g++
            build_type: Debug
            vcpkg_triplet: x64-mingw-static

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install LLVM (Clang-CL)
        if: matrix.c_compiler == 'clang-cl'
        run: choco install llvm

      - name: Install sccache
        run: choco install sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\sccache
          key: sccache-windows-${{ matrix.c_compiler }}-${{ matrix.build_type }}
          restore-keys: |
            sccache-windows-${{ matrix.c_compiler }}

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Windows SDK
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        with:
          sdk-version: 26100

      - name: Setup MSVC
        if: matrix.name != 'MinGW-UCRT'
        uses: TheMrMilchmann/setup-msvc-dev@v3.0.1
        with:
          arch: x64

      - name: Install MinGW-UCRT (MSYS2)
        if: matrix.name == 'MinGW-UCRT' || matrix.name == 'Clang'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ffmpeg

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # -------------------------------
      # vcpkg (Optimized Caching)
      # -------------------------------
      - name: vcpkg build
        id: vcpkg
        uses: johnwason/vcpkg-action@v7
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: ${{ matrix.vcpkg_triplet }}
          token: ${{ github.token }}
          cache-key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json') }}

      # Configure + Build steps unchanged below
      # (kept identical to your original for correctness)

      - name: Configure CMake (MSVC/Clang-CL)
        if: matrix.name != 'MinGW-UCRT' && matrix.name != 'Clang'
        shell: bash
        run: |
          if [[ "${{ matrix.c_compiler }}" == "cl" ]]; then
              LAUNCHER_OPTS=""
          else
              LAUNCHER_OPTS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          fi

          TOOLCHAIN_PATH=$(cygpath -m "${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake")

          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN_PATH \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_PLATFORM_D3D12=ON \
            -DNX_BUILD_TESTS=1 \
            $LAUNCHER_OPTS \
            -S .

      - name: Configure CMake (MSYS2 MinGW-UCRT)
        if: matrix.name == 'MinGW-UCRT' || matrix.name == 'Clang'
        shell: msys2 {0}
        run: |
          TOOLCHAIN_FILE="$(cygpath -u "${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake")"
      
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_BUILD_TESTS=1 \
            -S .

      - name: Build (MSVC/Clang-CL)
        if: matrix.name == 'MSVC' || matrix.name == 'Clang-CL'
        run: cmake --build build --target TestRunner

      - name: Build (MSYS2)
        if: matrix.name == 'MinGW-UCRT' || matrix.name == 'Clang'
        shell: msys2 {0}
        run: cmake --build build --target TestRunner

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel

      - name: sccache stats
        run: sccache --show-stats || true

  # ============================================================
  # LINUX JOB
  # ============================================================
  build-linux:
    name: Build (Linux - ${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
            vcpkg_triplet: x64-linux

          - name: GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Debug
            vcpkg_triplet: x64-linux

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            vcpkg_triplet: x64-linux

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug
            vcpkg_triplet: x64-linux

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build \
            libgl1-mesa-dev libx11-dev \
            nasm autoconf automake libtool sccache

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-linux-${{ matrix.c_compiler }}-${{ matrix.build_type }}
          restore-keys: |
            sccache-linux-${{ matrix.c_compiler }}

      - name: vcpkg build
        id: vcpkg
        uses: johnwason/vcpkg-action@v7
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: ${{ matrix.vcpkg_triplet }}
          token: ${{ github.token }}
          cache-key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DNX_BUILD_TESTS=1 \
            -S .

      - name: Build
        run: cmake --build build --target TestRunner

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel

      - name: sccache stats
        run: sccache --show-stats || true