name: Build and Test (Multi-Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ============================================================
# WINDOWS
# ============================================================
jobs:
  build-windows:
    name: Build (Windows - ${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: windows-latest

    env:
      SCCACHE_IDLE_TIMEOUT: 0

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

          - name: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Debug

          - name: Clang-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Release

          - name: Clang-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Debug

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug

          - name: MinGW-UCRT
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

          - name: MinGW-UCRT
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Debug

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------
      # CPM cache
      # ------------------------------------------------------------
      - name: Cache CPM
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\cache\CPM
          key: cpm-windows-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            cpm-windows-

      # ------------------------------------------------------------
      # sccache
      # ------------------------------------------------------------
      - name: Install sccache
        run: choco install sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Mozilla\sccache
          key: sccache-windows-${{ matrix.c_compiler }}
          restore-keys: |
            sccache-windows-

      # ------------------------------------------------------------
      # LLVM (fast install)
      # ------------------------------------------------------------
      - uses: KyleMayes/install-llvm-action@v2
        if: matrix.c_compiler == 'clang' || matrix.c_compiler == 'clang-cl'
        with:
          version: "18"

      # ------------------------------------------------------------
      # Ninja
      # ------------------------------------------------------------
      - uses: seanmiddleditch/gha-setup-ninja@v6

      # ------------------------------------------------------------
      # MSVC environment
      # ------------------------------------------------------------
      - name: Setup MSVC
        if: matrix.c_compiler == 'cl' || matrix.c_compiler == 'clang-cl'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ------------------------------------------------------------
      # MSYS2 (MinGW-UCRT)
      # ------------------------------------------------------------
      - name: Setup MSYS2
        if: matrix.name == 'MinGW-UCRT'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      # ------------------------------------------------------------
      # Vulkan SDK
      # ------------------------------------------------------------
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # ------------------------------------------------------------
      # Configure (Native Windows)
      # ------------------------------------------------------------
      - name: Configure CMake (Windows)
        if: matrix.name != 'MinGW-UCRT'
        shell: pwsh
        run: |
          $extra = ""
          $extra += " -DCMAKE_C_COMPILER_LAUNCHER=sccache"
          $extra += " -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"

          cmake -B build `
            -G Ninja `
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} `
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCPM_USE_LOCAL_PACKAGES=ON `
            -DCPM_DOWNLOAD_ALL=ON `
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF `
            -DCMAKE_CXX_MODULES=OFF `
            -DALSOFT_REQUIRE_MODULES=OFF `
            -DALSOFT_BUILD_MODULES=OFF `
            -DHAVE_CXXMODULES:BOOL=OFF `
            -DNX_PLATFORM_OPENGL=1 `
            -DNX_PLATFORM_VULKAN=1 `
            -DNX_PLATFORM_OPENAL=1 `
            -DNX_PLATFORM_D3D12=ON `
            -DNX_BUILD_TESTS=1 `
            -DCPM_SOURCE_CACHE=${{ github.workspace }}\cache\CPM `
            $extra `
            -S .

      # ------------------------------------------------------------
      # Configure (MSYS2)
      # ------------------------------------------------------------
      - name: Configure CMake (MSYS2)
        if: matrix.name == 'MinGW-UCRT'
        shell: msys2 {0}
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCPM_USE_LOCAL_PACKAGES=ON \
            -DCPM_DOWNLOAD_ALL=ON \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCMAKE_CXX_MODULES=OFF \
            -DALSOFT_REQUIRE_MODULES=OFF \
            -DALSOFT_BUILD_MODULES=OFF \
            -DHAVE_CXXMODULES:BOOL=OFF \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_BUILD_TESTS=1 \
            -DCPM_SOURCE_CACHE=${{ github.workspace }}\cache\CPM \
            -S .

      # ------------------------------------------------------------
      # Speed: Defender exclusion
      # ------------------------------------------------------------
      - name: Disable Defender scanning for build dir
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$pwd\build"

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build
        run: cmake --build build --target TestRunner --parallel

      - name: sccache stats
        run: sccache --show-stats || true

  # ============================================================
  # LINUX
  # ============================================================
  build-linux:
    name: Build (Linux - ${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: ubuntu-24.04

    env:
      SCCACHE_IDLE_TIMEOUT: 0

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

          - name: GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Debug

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # CPM cache
      - name: Cache CPM
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/CPM
          key: cpm-linux-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            cpm-linux-

      # sccache
      - name: Install sccache
        run: sudo apt-get update && sudo apt-get install -y sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/sccache
          key: sccache-linux-${{ matrix.c_compiler }}
          restore-keys: |
            sccache-linux-

      # Dependencies
      - name: Install deps
        run: |
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libx11-dev \
            xorg-dev \
            clang \
            lld

      - uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # Configure
      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCPM_USE_LOCAL_PACKAGES=ON \
            -DCPM_DOWNLOAD_ALL=ON \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DALSOFT_BUILD_MODULES=OFF \
            -DHAVE_CXXMODULES:BOOL=OFF \
            -DCMAKE_CXX_MODULES=OFF \
            -DALSOFT_REQUIRE_MODULES=OFF \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_BUILD_TESTS=1 \
            -DCPM_SOURCE_CACHE=${{ github.workspace }}/.cache/CPM \
            -S .

      - name: Build
        run: cmake --build build --target TestRunner --parallel

      - name: sccache stats
        run: sccache --show-stats || true
