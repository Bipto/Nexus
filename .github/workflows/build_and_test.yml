build-windows:
  name: Build (Windows - ${{ matrix.name }} - ${{ matrix.type }})
  runs-on: windows-latest

  env:
    SCCACHE_IDLE_TIMEOUT: 0
    SCCACHE_CACHE_SIZE: 5G

  strategy:
    fail-fast: false
    matrix:
      include:
        - { name: MSVC,      c: cl,        cxx: cl,        type: Release }
        - { name: MSVC,      c: cl,        cxx: cl,        type: Debug }
        - { name: Clang-CL,  c: clang-cl,  cxx: clang-cl,  type: Release }
        - { name: Clang-CL,  c: clang-cl,  cxx: clang-cl,  type: Debug }
        - { name: Clang,     c: clang,     cxx: clang++,   type: Release }
        - { name: Clang,     c: clang,     cxx: clang++,   type: Debug }
        - { name: MinGW-UCRT,c: gcc,       cxx: g++,       type: Release }
        - { name: MinGW-UCRT,c: gcc,       cxx: g++,       type: Debug }

  steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    # ------------------------------------------------------------
    # CPM Cache
    # ------------------------------------------------------------
    - uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.cache/CPM
        key: cpm-windows-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
        restore-keys: cpm-windows-

    # ------------------------------------------------------------
    # sccache
    # ------------------------------------------------------------
    - name: Install sccache
      run: choco install sccache

    - uses: actions/cache@v4
      with:
        path: ~\AppData\Local\Mozilla\sccache
        key: sccache-windows-${{ matrix.c }}-${{ matrix.type }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          sccache-windows-${{ matrix.c }}-${{ matrix.type }}-
          sccache-windows-${{ matrix.c }}-

    - name: Start sccache
      if: matrix.c != 'cl'
      run: sccache --start-server

    # ------------------------------------------------------------
    # LLVM (for clang variants)
    # ------------------------------------------------------------
    - uses: KyleMayes/install-llvm-action@v2
      if: matrix.c == 'clang' || matrix.c == 'clang-cl'
      with:
        version: "21"

    - uses: seanmiddleditch/gha-setup-ninja@v6

    # ------------------------------------------------------------
    # MSVC ENV (needed for rc.exe + Windows SDK)
    # ------------------------------------------------------------
    - name: Setup MSVC
      if: matrix.name != 'MinGW-UCRT'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # ------------------------------------------------------------
    # MSYS2 (MinGW only)
    # ------------------------------------------------------------
    - name: Setup MSYS2
      if: matrix.name == 'MinGW-UCRT'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: false
        install: >
          mingw-w64-ucrt-x86_64-toolchain
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-openal

    - name: Add sccache to MSYS2 PATH
      if: matrix.name == 'MinGW-UCRT'
      shell: msys2 {0}
      run: echo "export PATH=/c/ProgramData/chocolatey/bin:\$PATH" >> ~/.bashrc

    # ------------------------------------------------------------
    # Vulkan
    # ------------------------------------------------------------
    - uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.4.309.0
        cache: true

    # ------------------------------------------------------------
    # Configure (Native Windows)
    # ------------------------------------------------------------
    - name: Configure CMake (Windows)
      if: matrix.name != 'MinGW-UCRT'
      shell: pwsh
      run: |
        $launcher = ""

        if ("${{ matrix.c }}" -eq "clang-cl") {
          $launcher += " -DCMAKE_RC_COMPILER=rc"
        }

        if ("${{ matrix.c }}" -ne "cl") {
          $launcher += " -DCMAKE_C_COMPILER_LAUNCHER=sccache"
          $launcher += " -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
        }

        cmake -S . -B build `
          -G Ninja `
          -DCMAKE_C_COMPILER=${{ matrix.c }} `
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} `
          -DCMAKE_BUILD_TYPE=${{ matrix.type }} `
          -DCPM_USE_LOCAL_PACKAGES=ON `
          -DCPM_DOWNLOAD_ALL=ON `
          -DNX_PLATFORM_OPENGL=1 `
          -DNX_PLATFORM_VULKAN=1 `
          -DNX_PLATFORM_OPENAL=1 `
          -DNX_PLATFORM_D3D12=ON `
          -DNX_BUILD_TESTS=1 `
          -DCRT_SECURE_NO_WARNINGS=ON `
          -DCPM_SOURCE_CACHE=${{ github.workspace }}/.cache/CPM `
          $launcher

    # ------------------------------------------------------------
    # Configure (MSYS2)
    # ------------------------------------------------------------
    - name: Configure CMake (MSYS2)
      if: matrix.name == 'MinGW-UCRT'
      shell: msys2 {0}
      run: |
        cmake -S . -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.type }} \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DCPM_USE_LOCAL_PACKAGES=ON \
          -DCPM_DOWNLOAD_ALL=ON \
          -DNX_PLATFORM_OPENGL=1 \
          -DNX_PLATFORM_VULKAN=1 \
          -DNX_PLATFORM_OPENAL=1 \
          -DNX_BUILD_TESTS=1 \
          -DCRT_SECURE_NO_WARNINGS=ON \
          -DCPM_SOURCE_CACHE=${{ github.workspace }}/.cache/CPM

    # ------------------------------------------------------------
    # Build + Test
    # ------------------------------------------------------------
    - name: Build
      run: cmake --build build --parallel

    - name: Run tests
      run: ctest --test-dir build --output-on-failure --parallel

    - name: sccache stats
      if: matrix.c != 'cl'
      run: sccache --show-stats || true
