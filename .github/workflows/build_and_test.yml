name: Build and Test (Multi-Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ============================================================
# WINDOWS
# ============================================================
jobs:
  build-windows:
    name: Windows (${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: windows-latest

    env:
      CPM_SOURCE_CACHE: C:\cpm-cache

    strategy:
      fail-fast: false
      matrix:
        include:
          # ----------------------------
          # MSVC
          # ----------------------------
          - name: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

          - name: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Debug

          # ----------------------------
          # Clang-CL
          # ----------------------------
          - name: Clang-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Release

          - name: Clang-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Debug

          # ----------------------------
          # Clang
          # ----------------------------
          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug

          # ----------------------------
          # MinGW-UCRT
          # ----------------------------
          - name: MinGW-UCRT
            c_compiler: ucrt64-w64-mingw32-gcc
            cpp_compiler: ucrt64-w64-mingw32-g++
            build_type: Release

          - name: MinGW-UCRT
            c_compiler: ucrt64-w64-mingw32-gcc
            cpp_compiler: ucrt64-w64-mingw32-g++
            build_type: Debug

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -------------------------------
      # CPM cache (shared across all Windows jobs)
      # -------------------------------
      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: C:\cpm-cache
          key: cpm-windows-${{ hashFiles('**/CMakeLists.txt', '**/cmake/*.cmake') }}
          restore-keys: |
            cpm-windows-

      # -------------------------------
      # Tooling
      # -------------------------------
      - name: Install LLVM
        if: matrix.c_compiler == 'clang' || matrix.c_compiler == 'clang-cl'
        run: choco install llvm

      - name: Install sccache
        run: choco install sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\sccache
          key: sccache-windows-${{ matrix.c_compiler }}-${{ matrix.build_type }}
          restore-keys: |
            sccache-windows-

      - uses: seanmiddleditch/gha-setup-ninja@v6

      - uses: TheMrMilchmann/setup-msvc-dev@v3
        if: matrix.name != 'MinGW-UCRT'
        with:
          arch: x64

      # -------------------------------
      # MSYS2 (MinGW-UCRT)
      # -------------------------------
      - name: Setup MSYS2
        if: matrix.name == 'MinGW-UCRT'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      # -------------------------------
      # Vulkan
      # -------------------------------
      - uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # -------------------------------
      # Configure
      # -------------------------------
      - name: Configure (MSVC / Clang)
        if: matrix.name != 'MinGW-UCRT'
        shell: bash
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCMAKE_CXX_MODULES=OFF \
            -DNX_BUILD_TESTS=1 \
            -S .

      - name: Configure (MinGW-UCRT)
        if: matrix.name == 'MinGW-UCRT'
        shell: msys2 {0}
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCMAKE_CXX_MODULES=OFF \
            -DNX_BUILD_TESTS=1 \
            -S .

      # -------------------------------
      # Build
      # -------------------------------
      - name: Build
        run: cmake --build build --target TestRunner

      - name: sccache stats
        run: sccache --show-stats || true

# ============================================================
# LINUX
# ============================================================
  build-linux:
    name: Linux (${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: ubuntu-24.04

    env:
      CPM_SOURCE_CACHE: ~/.cache/cpm

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

          - name: GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Debug

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # -------------------------------
      # CPM cache
      # -------------------------------
      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/cpm
          key: cpm-linux-${{ hashFiles('**/CMakeLists.txt', '**/cmake/*.cmake') }}
          restore-keys: |
            cpm-linux-

      # -------------------------------
      # Dependencies
      # -------------------------------
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build sccache \
            libgl1-mesa-dev libx11-dev

      - uses: seanmiddleditch/gha-setup-ninja@v6

      - uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # -------------------------------
      # Configure & Build
      # -------------------------------
      - name: Configure
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCMAKE_CXX_MODULES=OFF \
            -DNX_BUILD_TESTS=1 \
            -S .

      - run: cmake --build build --target TestRunner

      - run: sccache --show-stats || true
