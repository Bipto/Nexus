name: Build and Test (Multi‑Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================
  # WINDOWS JOB
  # ============================================================
  build-windows:
    name: Build (Windows - ${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # MSVC
          - name: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            vcpkg_triplet: x64-windows

          - name: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Debug
            vcpkg_triplet: x64-windows

          # Clang-CL (recommended Windows Clang)
          - name: Clang-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Release
            vcpkg_triplet: x64-windows

          - name: Clang-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Debug
            vcpkg_triplet: x64-windows

          # MSYS2 MinGW-UCRT
          - name: MinGW-UCRT
            build_type: Release
            vcpkg_triplet: x64-mingw-static

          - name: MinGW-UCRT
            build_type: Debug
            vcpkg_triplet: x64-mingw-static

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------
      # Common tools
      # ------------------------------------------------------------
      - name: Install sccache (Windows)
        if: matrix.name != 'MinGW-UCRT'
        run: choco install sccache

      - name: Cache sccache (Windows)
        if: matrix.name != 'MinGW-UCRT'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\sccache
          key: sccache-windows-${{ matrix.name }}-${{ matrix.build_type }}
          restore-keys: |
            sccache-windows-${{ matrix.name }}

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Windows SDK
        if: matrix.name != 'MinGW-UCRT'
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        with:
          sdk-version: 26100

      - name: Setup MSVC
        if: matrix.name != 'MinGW-UCRT'
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64

      # ------------------------------------------------------------
      # MSYS2 setup (MinGW-UCRT only)
      # ------------------------------------------------------------
      - name: Install MSYS2 (MinGW-UCRT)
        if: matrix.name == 'MinGW-UCRT'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sccache
            mingw-w64-ucrt-x86_64-ffmpeg

      - name: Cache sccache (MSYS2)
        if: matrix.name == 'MinGW-UCRT'
        uses: actions/cache@v4
        with:
          path: C:\msys64\ucrt64\var\cache\sccache
          key: sccache-msys2-${{ matrix.build_type }}
          restore-keys: |
            sccache-msys2-

      # ------------------------------------------------------------
      # Vulkan + vcpkg
      # ------------------------------------------------------------
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Clone vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ matrix.build_type }}

      # ============================================================
      # Configure (MSVC / Clang-CL)
      # ============================================================
      - name: Configure CMake (MSVC/Clang-CL)
        if: matrix.name != 'MinGW-UCRT'
        shell: bash
        run: |
          export SCCACHE_BASE_DIR="$GITHUB_WORKSPACE"

          TOOLCHAIN_PATH=$(cygpath -m "${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake")

          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN_PATH \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_PLATFORM_D3D12=ON \
            -DNX_BUILD_TESTS=1 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -S .

      # ============================================================
      # Configure (MSYS2 MinGW)
      # ============================================================
      - name: Configure CMake (MSYS2)
        if: matrix.name == 'MinGW-UCRT'
        shell: msys2 {0}
        run: |
          export SCCACHE_BASE_DIR="$GITHUB_WORKSPACE"

          TOOLCHAIN_FILE="$(cygpath -u "${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake")"

          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_BUILD_TESTS=1 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -S .

      # ============================================================
      # Build
      # ============================================================
      - name: Build (MSVC/Clang-CL)
        if: matrix.name != 'MinGW-UCRT'
        run: cmake --build build --target TestRunner

      - name: Build (MSYS2)
        if: matrix.name == 'MinGW-UCRT'
        shell: msys2 {0}
        run: cmake --build build --target TestRunner

      # ============================================================
      # Test
      # ============================================================
      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel

      # ============================================================
      # sccache stats
      # ============================================================
      - name: sccache stats (Windows)
        if: matrix.name != 'MinGW-UCRT'
        run: sccache --show-stats || true

      - name: sccache stats (MSYS2)
        if: matrix.name == 'MinGW-UCRT'
        shell: msys2 {0}
        run: sccache --show-stats || true

  # ============================================================
  # LINUX JOB
  # ============================================================
  build-linux:
    name: Build (Linux - ${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
            vcpkg_triplet: x64-linux

          - name: GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Debug
            vcpkg_triplet: x64-linux

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            vcpkg_triplet: x64-linux

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug
            vcpkg_triplet: x64-linux

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix apt mirror sync issues
        run: |
          sudo apt-get clean
          sudo apt-get update --allow-releaseinfo-change
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::No-Cache=True

      - name: Install Linux dependencies
        run: |
          sudo apt-get install -y \
            libgl1-mesa-dev mesa-utils mesa-common-dev \
            libx11-dev xserver-xorg-dev xorg-dev \
            build-essential nasm autoconf autoconf-archive automake libtool libltdl-dev

      - name: Install libc++ for Clang
        if: matrix.c_compiler == 'clang'
        run: |
          sudo apt-get install -y libc++-dev libc++abi-dev

      - name: Install sccache
        run: sudo apt-get install -y sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-linux-${{ matrix.c_compiler }}-${{ matrix.build_type }}
          restore-keys: |
            sccache-linux-${{ matrix.c_compiler }}

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Clone vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ matrix.build_type }}

      - name: Configure CMake (GCC)
        if: matrix.c_compiler == 'gcc'
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_BUILD_TESTS=1 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -S .

      - name: Configure CMake (Clang)
        if: matrix.c_compiler == 'clang'
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_STANDARD_LIBRARY=libc++ \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_BUILD_TESTS=1 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -S .


      - name: Build
        run: cmake --build build --target TestRunner

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel

      - name: sccache stats
        run: sccache --show-stats || true