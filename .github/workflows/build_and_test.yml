name: Build and Test (Multi‑Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================
  # WINDOWS JOB
  # ============================================================
  build-windows:
    name: Build (Windows - ${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # MSVC
          - name: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

          - name: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Debug

          # Clang-CL
          - name: Clang-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Release

          - name: Clang-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Debug

          # MinGW-UCRT (MSYS2)
          - name: MinGW-UCRT
            c_compiler: ucrt64-w64-mingw32-gcc
            cpp_compiler: ucrt64-w64-mingw32-g++
            build_type: Release

          - name: MinGW-UCRT
            c_compiler: ucrt64-w64-mingw32-gcc
            cpp_compiler: ucrt64-w64-mingw32-g++
            build_type: Debug

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -------------------------------
      # MSVC / Clang-CL setup
      # -------------------------------
      - name: Install LLVM (Clang-CL)
        if: matrix.c_compiler == 'clang-cl'
        run: choco install llvm

      - name: Install sccache
        run: choco install sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\sccache
          key: sccache-windows-${{ matrix.c_compiler }}-${{ matrix.build_type }}
          restore-keys: |
            sccache-windows-${{ matrix.c_compiler }}

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Windows SDK
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        with:
          sdk-version: 26100

      - name: Setup MSVC
        if: matrix.name != 'MinGW-UCRT'
        uses: TheMrMilchmann/setup-msvc-dev@v3.0.1
        with:
          arch: x64

      # ------------------------------------------------------------
      # MSYS2 MinGW-UCRT setup
      # ------------------------------------------------------------
      - name: Install MinGW-UCRT (MSYS2)
        if: matrix.name == 'MinGW-UCRT'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ffmpeg

      # ------------------------------------------------------------
      # Vulkan SDK
      # ------------------------------------------------------------
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # ------------------------------------------------------------
      # CMake configure (MSVC / Clang-CL)
      # ------------------------------------------------------------
      - name: Configure CMake (MSVC/Clang-CL)
        if: matrix.name != 'MinGW-UCRT'
        shell: bash
        run: |
          if [[ "${{ matrix.c_compiler }}" == "cl" ]]; then
              LAUNCHER_OPTS=""
          else
              LAUNCHER_OPTS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          fi

          cmake -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_PLATFORM_D3D12=ON \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DNX_BUILD_TESTS=1 \
            $LAUNCHER_OPTS \
            -S .

      # ------------------------------------------------------------
      # CMake configure (MSYS2 MinGW-UCRT)
      # ------------------------------------------------------------
      - name: Configure CMake (MSYS2 MinGW-UCRT)
        if: matrix.name == 'MinGW-UCRT'
        shell: msys2 {0}
        run: |
     
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_BUILD_TESTS=1 \
            -S .


      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build (MSVC/Clang-CL)
        if: matrix.name != 'MinGW-UCRT'
        run: cmake --build build --target TestRunner

      - name: Build (MSYS2 MinGW-UCRT)
        if: matrix.name == 'MinGW-UCRT'
        shell: msys2 {0}
        run: cmake --build build --target TestRunner

      - name: sccache stats
        run: sccache --show-stats || true

  # ============================================================
  # LINUX JOB
  # ============================================================
  build-linux:
    name: Build (Linux - ${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

          - name: GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Debug

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix apt mirror sync issues
        run: |
          sudo apt-get clean
          sudo apt-get update --allow-releaseinfo-change
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::No-Cache=True

      - name: Install Linux dependencies
        run: |
          sudo apt-get install -y \
            libgl1-mesa-dev mesa-utils mesa-common-dev \
            libx11-dev xserver-xorg-dev xorg-dev \
            build-essential nasm autoconf autoconf-archive automake libtool libltdl-dev

      - name: Install libc++ for Clang
        if: matrix.c_compiler == 'clang'
        run: |
          sudo apt-get install -y libc++-dev libc++abi-dev

      - name: Install Clang (latest)
        if: matrix.c_compiler == 'clang'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh all

      - name: Install sccache
        run: sudo apt-get install -y sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-linux-${{ matrix.c_compiler }}-${{ matrix.build_type }}
          restore-keys: |
            sccache-linux-${{ matrix.c_compiler }}

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DNX_BUILD_TESTS=1 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -S .

      - name: Build
        run: cmake --build build --target TestRunner

      - name: sccache stats
        run: sccache --show-stats || true
