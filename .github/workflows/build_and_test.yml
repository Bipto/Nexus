name: Build and Test (Multi‑Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================
  # WINDOWS JOB
  # ============================================================
  build-windows:
    name: Build (Windows - ${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # MSVC
          - name: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            vcpkg_triplet: x64-windows

          - name: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Debug
            vcpkg_triplet: x64-windows

          #Clang
          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            vcpkg_triplet: x64-mingw-static

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug
            vcpkg_triplet: x64-mingw-static

          # Clang-CL
          - name: Clang-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Release
            vcpkg_triplet: x64-windows

          - name: Clang-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Debug
            vcpkg_triplet: x64-windows

          # MinGW-UCRT (MSYS2)
          - name: MinGW-UCRT
            c_compiler: ucrt64-w64-mingw32-gcc
            cpp_compiler: ucrt64-w64-mingw32-g++
            build_type: Release
            vcpkg_triplet: x64-mingw-static

          - name: MinGW-UCRT
            c_compiler: ucrt64-w64-mingw32-gcc
            cpp_compiler: ucrt64-w64-mingw32-g++
            build_type: Debug
            vcpkg_triplet: x64-mingw-static

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -------------------------------
      # MSVC / Clang-CL setup
      # -------------------------------
      - name: Install LLVM (Clang-CL)
        if: matrix.c_compiler == 'clang-cl'
        run: choco install llvm

      - name: Install sccache
        run: choco install sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\sccache
          key: sccache-windows-${{ matrix.c_compiler }}-${{ matrix.build_type }}
          restore-keys: |
            sccache-windows-${{ matrix.c_compiler }}

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Windows SDK
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        with:
          sdk-version: 26100

      - name: Setup MSVC
        if: matrix.name != 'MinGW-UCRT'
        uses: TheMrMilchmann/setup-msvc-dev@v3.0.1
        with:
          arch: x64

      # ------------------------------------------------------------
      # MSYS2 MinGW-UCRT setup
      # ------------------------------------------------------------
      - name: Install MinGW-UCRT (MSYS2)
        if: matrix.name == 'MinGW-UCRT' || matrix.name == 'Clang'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ffmpeg

      # ------------------------------------------------------------
      # Vulkan SDK + vcpkg
      # ------------------------------------------------------------
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: vcpkg build
        id: vcpkg
        uses: johnwason/vcpkg-action@v7
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: ${{ matrix.vcpkg_triplet }}
          token: ${{ github.token }}
          cache-key: >
            vcpkg-${{ runner.os }}-
            ${{ matrix.vcpkg_triplet }}-
            ${{ matrix.c_compiler }}-
            ${{ matrix.build_type }}-
            ${{ hashFiles('vcpkg.json') }}

      # ------------------------------------------------------------
      # CMake configure (MSVC / Clang-CL)
      # ------------------------------------------------------------
      - name: Configure CMake (MSVC/Clang-CL)
        if: matrix.name != 'MinGW-UCRT' && matrix.name != 'Clang'
        shell: bash
        run: |
          if [[ "${{ matrix.c_compiler }}" == "cl" ]]; then
              LAUNCHER_OPTS=""
          else
              LAUNCHER_OPTS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          fi

          TOOLCHAIN_PATH=$(cygpath -m "${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake")

          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$TOOLCHAIN_PATH \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_PLATFORM_D3D12=ON \
            -DNX_BUILD_TESTS=1 \
            $LAUNCHER_OPTS \
            -S .

      # ------------------------------------------------------------
      # CMake configure (MSYS2 MinGW-UCRT)
      # ------------------------------------------------------------
      - name: Configure CMake (MSYS2 MinGW-UCRT)
        if: matrix.name == 'MinGW-UCRT' || matrix.name == 'Clang'
        shell: msys2 {0}
        run: |
          TOOLCHAIN_FILE="$(cygpath -u "${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake")"
      
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_BUILD_TESTS=1 \
            -S .


      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      # MSVC / Clang-CL
      - name: Build (MSVC/Clang-CL)
        if: matrix.name == 'MSVC' || matrix.name == 'Clang-CL'
        run: cmake --build build --target TestRunner

      # MSYS2 (Clang + MinGW-UCRT)
      - name: Build (MSYS2)
        if: matrix.name == 'MinGW-UCRT' || matrix.name == 'Clang'
        shell: msys2 {0}
        run: cmake --build build --target TestRunner

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel

      - name: sccache stats
        run: sccache --show-stats || true

  # -------------------------------------
  # Build CI image
  # -------------------------------------
  build-image:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        run: |
          docker build \
            -t ghcr.io/bipto/ci-linux:${{ steps.meta.outputs.tag }} \
            -f docker/Dockerfile .

          docker push ghcr.io/bipto/ci-linux:${{ steps.meta.outputs.tag }}


  # ============================================================
  # LINUX JOB
  # ============================================================
  build-linux:
    name: Build (Linux - ${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/bipto/ci-linux:latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release
            vcpkg_triplet: x64-linux

          - name: GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Debug
            vcpkg_triplet: x64-linux

          - name: Clang
            c_compiler: clang-21
            cpp_compiler: clang++-21
            build_type: Release
            vcpkg_triplet: x64-linux

          - name: Clang
            c_compiler: clang-21
            cpp_compiler: clang++-21
            build_type: Debug
            vcpkg_triplet: x64-linux

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-linux-${{ matrix.c_compiler }}-${{ matrix.build_type }}
          restore-keys: |
            sccache-linux-${{ matrix.c_compiler }}

      - name: vcpkg build
        id: vcpkg
        uses: johnwason/vcpkg-action@v7
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: ${{ matrix.vcpkg_triplet }}
          token: ${{ github.token }}
          cache-key: >
            vcpkg-${{ runner.os }}-
            ${{ matrix.vcpkg_triplet }}-
            ${{ matrix.c_compiler }}-
            ${{ matrix.build_type }}-
            ${{ hashFiles('vcpkg.json') }}

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_BUILD_TESTS=1 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -S .

      - name: Build
        run: cmake --build build --target TestRunner

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel

      - name: sccache stats
        run: sccache --show-stats || true
