name: Build and Test (Multi‑Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # -------------------------
          # Windows (MSVC)
          # -------------------------
          - name: Windows (MSVC)
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            vcpkg_triplet: x64-windows
            build_type: Release

          - name: Windows (MSVC)
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            vcpkg_triplet: x64-windows
            build_type: Debug

          # Windows (Clang-CL)
          # -------------------------
          - name: Windows (Clang-CL)
            os: windows-latest
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            vcpkg_triplet: x64-windows
            build_type: Release

          - name: Windows (Clang-CL)
            os: windows-latest
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            vcpkg_triplet: x64-windows
            build_type: Debug

          # -------------------------
          # Ubuntu GCC
          # -------------------------
          - name: Ubuntu (GCC)
            os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            vcpkg_triplet: x64-linux
            build_type: Release

          - name: Ubuntu (GCC)
            os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            vcpkg_triplet: x64-linux
            build_type: Debug

          # -------------------------
          # Ubuntu Clang
          # -------------------------
          - name: Ubuntu (Clang)
            os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
            vcpkg_triplet: x64-linux
            build_type: Release

          - name: Ubuntu (Clang)
            os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
            vcpkg_triplet: x64-linux
            build_type: Debug

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -------------------------
      # Linux: System Prep
      # -------------------------
      - name: Fix apt mirror sync issues
        if: runner.os == 'Linux'
        run: |
          sudo apt-get clean
          sudo apt-get update --allow-releaseinfo-change
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::No-Cache=True

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            ninja-build \
            build-essential \
            autoconf autoconf-archive automake libtool \
            libgl1-mesa-dev mesa-utils mesa-common-dev \
            libx11-dev xserver-xorg-dev xorg-dev libltdl-dev

      - name: Install Clang + libc++ (Linux)
        if: runner.os == 'Linux' && matrix.c_compiler == 'clang'
        run: |
          sudo apt-get install -y libc++-dev libc++abi-dev
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh all

      - name: Verify Ninja
        if: runner.os == 'Linux'
        run: which ninja && ninja --version

      # -------------------------
      # Windows: Toolchain Setup
      # -------------------------
      - name: Install Windows SDK
        if: runner.os == 'Windows'
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        with:
          sdk-version: 26100

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v3.0.1
        with:
          arch: x64

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows' && matrix.c_compiler == 'clang-cl'
        run: choco install llvm

      # -------------------------
      # sccache (Linux + Windows)
      # -------------------------
      - name: Install sccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y sccache

      # -------------------------
      # Install LLVM (Windows) — needed for clang-cl
      # -------------------------
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows' && matrix.c_compiler == 'clang-cl'
        run: choco install llvm

      - name: Install sccache (Windows)
        if: runner.os == 'Windows'
        run: choco install sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sccache
            C:\Users\runneradmin\AppData\Local\sccache
          key: sccache-${{ runner.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ matrix.c_compiler }}

      # -------------------------
      # Vulkan SDK
      # -------------------------
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # -------------------------
      # vcpkg
      # -------------------------
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          git checkout master
          ./bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ matrix.c_compiler }}-${{ matrix.vcpkg_triplet }}-${{ matrix.build_type }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.c_compiler }}-${{ matrix.vcpkg_triplet }}

      # -------------------------
      # Configure CMake
      # -------------------------
      - name: Configure CMake
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
              D3D12=ON
              if [[ "${{ matrix.c_compiler }}" == "cl" ]]; then
                  LAUNCHER_OPTS=""
              else
                  LAUNCHER_OPTS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
              fi
          else
              D3D12=OFF
              LAUNCHER_OPTS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          fi

          EXTRA_CXX_FLAGS=""
          if [[ "$RUNNER_OS" == "Linux" && "${{ matrix.c_compiler }}" == "clang" ]]; then
              EXTRA_CXX_FLAGS="-stdlib=libc++"
          fi

          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_INSTALLED_DIR=$PWD/build/vcpkg_installed \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_CXX_FLAGS="${EXTRA_CXX_FLAGS}" \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DALSOFT_BUILD_MODULES=OFF \
            $LAUNCHER_OPTS \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_PLATFORM_D3D12=$D3D12 \
            -DNX_BUILD_TESTS=1 \
            -S .

      # -------------------------
      # Build
      # -------------------------
      - name: Build
        run: cmake --build build --target TestRunner

      # -------------------------
      # sccache stats
      # -------------------------
      - name: sccache stats
        run: sccache --show-stats || true
