name: Build and Test (Multi‑Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SCCACHE_CACHE_SIZE: "5G"
  SCCACHE_LOG: "info"

# ============================================================
# LINUX JOB
# ============================================================
jobs:
  linux:
    name: Linux (${{ matrix.c_compiler }} - ${{ matrix.build_type }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - c_compiler: gcc
            cpp_compiler: g++
            vcpkg_triplet: x64-linux
            build_type: Release

          - c_compiler: gcc
            cpp_compiler: g++
            vcpkg_triplet: x64-linux
            build_type: Debug

          - c_compiler: clang
            cpp_compiler: clang++
            vcpkg_triplet: x64-linux
            build_type: Release

          - c_compiler: clang
            cpp_compiler: clang++
            vcpkg_triplet: x64-linux
            build_type: Debug

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build build-essential \
            autoconf autoconf-archive automake libtool \
            libgl1-mesa-dev libx11-dev libltdl-dev \
            sccache nasm

      - name: Install Clang + libc++ (Linux)
        if: matrix.c_compiler == 'clang'
        shell: bash
        run: |
          sudo apt-get install -y clang libc++-dev libc++abi-dev

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-linux-${{ matrix.c_compiler }}-${{ matrix.build_type }}
          restore-keys: |
            sccache-linux-${{ matrix.c_compiler }}

      - name: Set SCCACHE_DIR
        shell: bash
        run: echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> $GITHUB_ENV

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Enable vcpkg binary caching
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/vcpkg_cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg_cache" >> $GITHUB_ENV

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-lock.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-lock.json') }}

      - name: Install vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          git checkout master
          ./bootstrap-vcpkg.sh -disableMetrics

      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV

      - name: Configure CMake (Linux)
        shell: bash
        run: |
          EXTRA_CXX_FLAGS=""
          if [[ "${{ matrix.c_compiler }}" == "clang" ]]; then
            EXTRA_CXX_FLAGS="-stdlib=libc++"
          fi

          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_CXX_FLAGS="${EXTRA_CXX_FLAGS}" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_PLATFORM_D3D12=OFF \
            -DNX_BUILD_TESTS=1 \
            -S .

      - name: Build
        shell: bash
        run: |
          cmake --build build --target TestRunner

      - name: Run tests
        shell: bash
        run: ./build/TestRunner || true

      - name: sccache stats
        shell: bash
        run: sccache --show-stats || true


# ============================================================
# WINDOWS JOB
# ============================================================
  windows:
    name: Windows (${{ matrix.c_compiler }} - ${{ matrix.build_type }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - c_compiler: cl
            cpp_compiler: cl
            vcpkg_triplet: x64-windows
            build_type: Release

          - c_compiler: cl
            cpp_compiler: cl
            vcpkg_triplet: x64-windows
            build_type: Debug

          - c_compiler: clang-cl
            cpp_compiler: clang-cl
            vcpkg_triplet: x64-windows
            build_type: Release

          - c_compiler: clang-cl
            cpp_compiler: clang-cl
            vcpkg_triplet: x64-windows
            build_type: Debug

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC
        if: matrix.c_compiler == 'cl'
        uses: TheMrMilchmann/setup-msvc-dev@v3.0.1
        with:
          arch: x64

      - name: Install LLVM (Windows)
        if: matrix.c_compiler == 'clang-cl'
        shell: pwsh
        run: choco install llvm

      - name: Install sccache (Windows)
        shell: pwsh
        run: |
          choco install sccache
          Add-Content $env:GITHUB_PATH "C:\ProgramData\chocolatey\bin"

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\sccache
          key: sccache-windows-${{ matrix.c_compiler }}-${{ matrix.build_type }}
          restore-keys: |
            sccache-windows-${{ matrix.c_compiler }}

      - name: Set SCCACHE_DIR
        shell: pwsh
        run: echo "SCCACHE_DIR=C:/Users/runneradmin/AppData/Local/Mozilla/sccache" >> $env:GITHUB_ENV

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Enable vcpkg binary caching
        shell: pwsh
        run: |
          mkdir vcpkg_cache -ea 0
          Add-Content $env:GITHUB_ENV "VCPKG_BINARY_SOURCES=clear;files,$pwd/vcpkg_cache"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          git checkout master
          .\bootstrap-vcpkg.bat -disableMetrics

      - name: Set VCPKG_ROOT
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "VCPKG_ROOT=$pwd/vcpkg"

      - name: Configure CMake (Windows)
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"

          $launcher = ""
          if ("${{ matrix.c_compiler }}" -ne "cl") {
            $launcher = "-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          }

          cmake -B build `
            -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} `
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} `
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} `
            $launcher `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DNX_PLATFORM_OPENGL=1 `
            -DNX_PLATFORM_VULKAN=1 `
            -DNX_PLATFORM_OPENAL=1 `
            -DNX_PLATFORM_D3D12=ON `
            -DNX_BUILD_TESTS=1 `
            -S .

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --target TestRunner

      - name: Run tests
        shell: pwsh
        run: .\build\TestRunner.exe || exit 0

      - name: sccache stats
        shell: pwsh
        run: sccache --show-stats
