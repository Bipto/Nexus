name: Build and Test (Multi‑Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SCCACHE_CACHE_SIZE: "5G"
  SCCACHE_LOG: "info"
  VCPKG_COMMIT: "2026.01.16"

jobs:
# ============================================================
# LINUX JOB
# ============================================================
  linux:
    name: Linux (${{ matrix.c_compiler }} - ${{ matrix.build_type }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - { c_compiler: gcc,   cpp_compiler: g++,      vcpkg_triplet: x64-linux, build_type: Release }
          - { c_compiler: gcc,   cpp_compiler: g++,      vcpkg_triplet: x64-linux, build_type: Debug }
          - { c_compiler: clang, cpp_compiler: clang++,  vcpkg_triplet: x64-linux, build_type: Release }
          - { c_compiler: clang, cpp_compiler: clang++,  vcpkg_triplet: x64-linux, build_type: Debug }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build build-essential \
            autoconf autoconf-archive automake libtool \
            libgl1-mesa-dev libx11-dev libltdl-dev \
            sccache nasm clang libc++-dev libc++abi-dev

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-linux-${{ matrix.c_compiler }}-${{ matrix.build_type }}

      - name: Set SCCACHE_DIR
        run: echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> $GITHUB_ENV

      - uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Enable vcpkg binary caching
        run: |
          mkdir -p vcpkg_cache
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg_cache" >> $GITHUB_ENV

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          key: vcpkg-bin-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-lock.json') }}

      - name: Cache vcpkg installation
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-install-${{ runner.os }}-${{ env.VCPKG_COMMIT }}

      - name: Install vcpkg (if missing)
        run: |
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git
            cd vcpkg
            git checkout $VCPKG_COMMIT
            ./bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Set VCPKG_ROOT
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV

      - name: Configure CMake (Linux)
        run: |
          EXTRA_CXX_FLAGS=""
          if [[ "${{ matrix.c_compiler }}" == "clang" ]]; then
            EXTRA_CXX_FLAGS="-stdlib=libc++ -Wno-unused-command-line-argument"
          fi

          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_CXX_FLAGS="${EXTRA_CXX_FLAGS}" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_PLATFORM_D3D12=OFF \
            -DNX_BUILD_TESTS=1 \
            -S .

      - name: Build
        run: cmake --build build --target TestRunner --parallel

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure --parallel 2

      - name: sccache stats
        run: sccache --show-stats


# ============================================================
# WINDOWS JOB
# ============================================================
  windows:
    name: Windows (${{ matrix.c_compiler }} - ${{ matrix.build_type }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { c_compiler: cl,       cpp_compiler: cl,       vcpkg_triplet: x64-windows, build_type: Release }
          - { c_compiler: cl,       cpp_compiler: cl,       vcpkg_triplet: x64-windows, build_type: Debug }
          - { c_compiler: clang-cl, cpp_compiler: clang-cl, vcpkg_triplet: x64-windows, build_type: Release }
          - { c_compiler: clang-cl, cpp_compiler: clang-cl, vcpkg_triplet: x64-windows, build_type: Debug }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC
        if: matrix.c_compiler == 'cl'
        uses: TheMrMilchmann/setup-msvc-dev@v3.0.1
        with:
          arch: x64

      - name: Install LLVM (Windows)
        if: matrix.c_compiler == 'clang-cl'
        run: |
          choco install llvm
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"

      - name: Install sccache (Windows)
        run: |
          choco install sccache
          Add-Content $env:GITHUB_PATH "C:\ProgramData\chocolatey\bin"

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\Mozilla\sccache
          key: sccache-windows-${{ matrix.c_compiler }}-${{ matrix.build_type }}

      - name: Set SCCACHE_DIR
        run: Add-Content $env:GITHUB_ENV "SCCACHE_DIR=C:/Users/runneradmin/AppData/Local/Mozilla/sccache"

      - uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Enable vcpkg binary caching
        run: |
          mkdir vcpkg_cache -ea 0
          Add-Content $env:GITHUB_ENV "VCPKG_BINARY_SOURCES=clear;files,$pwd/vcpkg_cache"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          key: vcpkg-bin-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-lock.json') }}

      - name: Cache vcpkg installation
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-install-${{ runner.os }}-${{ env.VCPKG_COMMIT }}

      - name: Install vcpkg (if missing)
        run: |
          if (!(Test-Path "vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git
            cd vcpkg
            git checkout $env:VCPKG_COMMIT
            .\bootstrap-vcpkg.bat -disableMetrics
          }

      - name: Set VCPKG_ROOT
        run: Add-Content $env:GITHUB_ENV "VCPKG_ROOT=$pwd/vcpkg"

      - name: Configure CMake (Windows)
        run: |
          $toolchain = "$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"

          $extraFlags = ""
          if ("${{ matrix.c_compiler }}" -eq "clang-cl") {
            $extraFlags = "-DCMAKE_CXX_FLAGS=--driver-mode=cl -DCMAKE_C_FLAGS=--driver-mode=cl"
          }

          cmake -B build `
            -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} `
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} `
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            $extraFlags `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DNX_PLATFORM_OPENGL=1 `
            -DNX_PLATFORM_VULKAN=1 `
            -DNX_PLATFORM_OPENAL=1 `
            -DNX_PLATFORM_D3D12=ON `
            -DNX_BUILD_TESTS=1 `
            -S .

      - name: Build
        run: cmake --build build --target TestRunner --parallel

      - name: Run tests
        shell: bash
        run: |
          cd build
          ctest --output-on-failure --parallel 2

      - name: sccache stats
        run: sccache --show-stats
