name: Build and Test (Multi‑Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SCCACHE_CACHE_SIZE: "5G"
  SCCACHE_LOG: "info"

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.c_compiler }} - ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows MSVC
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            vcpkg_triplet: x64-windows
            build_type: Release

          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            vcpkg_triplet: x64-windows
            build_type: Debug

          # Windows Clang-CL
          - os: windows-latest
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            vcpkg_triplet: x64-windows
            build_type: Release

          - os: windows-latest
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            vcpkg_triplet: x64-windows
            build_type: Debug

          # Linux GCC
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            vcpkg_triplet: x64-linux
            build_type: Release

          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            vcpkg_triplet: x64-linux
            build_type: Debug

          # Linux Clang
          - os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
            vcpkg_triplet: x64-linux
            build_type: Release

          - os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
            vcpkg_triplet: x64-linux
            build_type: Debug

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -------------------------
      # Linux Setup
      # -------------------------
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build build-essential \
            autoconf autoconf-archive automake libtool \
            libgl1-mesa-dev libx11-dev libltdl-dev \
            sccache nasm

      - name: Install Clang + libc++ (Linux)
        if: runner.os == 'Linux' && matrix.c_compiler == 'clang'
        shell: bash
        run: |
          sudo apt-get install -y clang libc++-dev libc++abi-dev

      # -------------------------
      # Windows Setup
      # -------------------------
      - name: Setup MSVC
        if: runner.os == 'Windows' && matrix.c_compiler == 'cl'
        uses: TheMrMilchmann/setup-msvc-dev@v3.0.1
        with:
          arch: x64

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows' && matrix.c_compiler == 'clang-cl'
        shell: pwsh
        run: choco install llvm

      - name: Install sccache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install sccache
          Add-Content $env:GITHUB_PATH "C:\ProgramData\chocolatey\bin"

      # -------------------------
      # Ninja
      # -------------------------
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v3

      # -------------------------
      # sccache cache
      # -------------------------
      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.sccache
            C:\Users\runneradmin\AppData\Local\sccache
          key: sccache-${{ runner.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ matrix.c_compiler }}

      - name: Set SCCACHE_DIR
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "SCCACHE_DIR=C:/Users/runneradmin/AppData/Local/sccache" >> $GITHUB_ENV
          else
            echo "SCCACHE_DIR=${{ github.workspace }}/.sccache" >> $GITHUB_ENV
          fi

      # -------------------------
      # Vulkan SDK
      # -------------------------
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # -------------------------
      # vcpkg binary caching
      # -------------------------
      - name: Enable vcpkg binary caching
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/vcpkg_cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg_cache" >> $GITHUB_ENV

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}

      # -------------------------
      # vcpkg
      # -------------------------
      - name: Install vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          git checkout master
          ./bootstrap-vcpkg.sh -disableMetrics

      - name: Set VCPKG_ROOT
        shell: bash
        run: echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> $GITHUB_ENV

      # -------------------------
      # Configure CMake (Linux)
      # -------------------------
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          EXTRA_CXX_FLAGS=""
          if [[ "${{ matrix.c_compiler }}" == "clang" ]]; then
            EXTRA_CXX_FLAGS="-stdlib=libc++"
          fi

          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_CXX_FLAGS="${EXTRA_CXX_FLAGS}" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_PLATFORM_D3D12=OFF \
            -DNX_BUILD_TESTS=1 \
            -S .

      # -------------------------
      # Configure CMake (Windows)
      # -------------------------
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_ROOT "scripts/buildsystems/vcpkg.cmake"

          $launcher = ""
          if ("${{ matrix.c_compiler }}" -ne "cl") {
            $launcher = "-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          }

          cmake -B build `
            -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} `
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} `
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} `
            $launcher `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DNX_PLATFORM_OPENGL=1 `
            -DNX_PLATFORM_VULKAN=1 `
            -DNX_PLATFORM_OPENAL=1 `
            -DNX_PLATFORM_D3D12=ON `
            -DNX_BUILD_TESTS=1 `
            -S .

      # -------------------------
      # Build
      # -------------------------
      - name: Build
        shell: bash
        run: |
          sccache --start-server || true
          cmake --build build --target TestRunner
          sccache --stop-server || true

      # -------------------------
      # Run tests
      # -------------------------
      - name: Run tests
        shell: bash
        run: ./build/TestRunner || true

      # -------------------------
      # sccache stats
      # -------------------------
      - name: sccache stats
        shell: bash
        run: sccache --show-stats || true