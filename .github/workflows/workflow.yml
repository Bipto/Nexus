name: Build and Test (Multi‑Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (MSVC)
          - name: Windows (MSVC)
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

          - name: Windows (MSVC)
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Debug

          # Ubuntu GCC
          - name: Ubuntu (GCC)
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

          - name: Ubuntu (GCC)
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Debug

          # Ubuntu Clang
          - name: Ubuntu (Clang)
            os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          - name: Ubuntu (Clang)
            os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -------------------------
      # Ninja
      # -------------------------
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # -------------------------
      # Vulkan SDK
      # -------------------------
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # -------------------------
      # Linux dependencies
      # -------------------------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev mesa-utils mesa-common-dev \
            libx11-dev xserver-xorg-dev xorg-dev \
            build-essential

      # -------------------------
      # Clang installation (Linux)
      # -------------------------
      - name: Install Clang
        if: matrix.c_compiler == 'clang'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh all

      # -------------------------
      # Windows SDK + MSVC
      # -------------------------
      - name: Install Windows SDK
        if: runner.os == 'Windows'
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        with:
          sdk-version: 26100

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v3.0.1
        with:
          arch: x64

      # -------------------------
      # Configure CMake
      # -------------------------
      - name: Configure CMake
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
              D3D12=ON
          else
              D3D12=OFF
          fi

          cmake -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_PLATFORM_D3D12=$D3D12 \
            -DNX_BUILD_TESTS=1 \
            -S .

      # -------------------------
      # Build
      # -------------------------
      - name: Build
        run: cmake --build build --target TestRunner

      # -------------------------
      # Test (optional)
      # -------------------------
      # - name: Test
      #   working-directory: build
      #   run: ctest --output-on-failure
