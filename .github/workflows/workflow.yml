name: Build and Test (Multi‑Platform)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        include:
          # -------------------------
          # Windows (MSVC)
          # -------------------------
          - name: Windows (MSVC)
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

          - name: Windows (MSVC)
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Debug

          # -------------------------
          # Windows (LLVM Clang)
          # -------------------------
          - name: Windows (Clang)
            os: windows-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          - name: Windows (Clang)
            os: windows-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug

          # -------------------------
          # Ubuntu GCC
          # -------------------------
          - name: Ubuntu (GCC)
            os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

          - name: Ubuntu (GCC)
            os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Debug

          # -------------------------
          # Ubuntu Clang
          # -------------------------
          - name: Ubuntu (Clang)
            os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          - name: Ubuntu (Clang)
            os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix apt mirror sync issues
        if: runner.os == 'Linux'
        run: |
          sudo apt-get clean
          sudo apt-get update --allow-releaseinfo-change
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::No-Cache=True


      # -------------------------
      # Install libc++ for Clang (Linux)
      # -------------------------
      - name: Install libc++ for Clang
        if: runner.os == 'Linux' && matrix.c_compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc++-dev libc++abi-dev

      # -------------------------
      # Cache: sccache (Linux)
      # -------------------------
      - name: Cache sccache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ matrix.c_compiler }}-${{ matrix.build_type }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ matrix.c_compiler }}

      # -------------------------
      # Install sccache (Linux)
      # -------------------------
      - name: Install sccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y sccache

      # -------------------------
      # Install sccache (Windows Clang)
      # -------------------------
      - name: Install sccache (Windows)
        if: runner.os == 'Windows' && matrix.c_compiler == 'clang'
        run: choco install sccache

      # -------------------------
      # Cache: sccache (Windows Clang)
      # -------------------------
      - name: Cache sccache (Windows)
        if: runner.os == 'Windows' && matrix.c_compiler == 'clang'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\sccache
          key: sccache-windows-clang-${{ matrix.build_type }}
          restore-keys: |
            sccache-windows-clang-

      # -------------------------
      # Ninja
      # -------------------------
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # -------------------------
      # Vulkan SDK
      # -------------------------
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # -------------------------
      # Linux dependencies
      # -------------------------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y \
            libgl1-mesa-dev mesa-utils mesa-common-dev \
            libx11-dev xserver-xorg-dev xorg-dev \
            build-essential

      # -------------------------
      # Install Clang (Linux)
      # -------------------------
      - name: Install Clang
        if: runner.os == 'Linux' && matrix.c_compiler == 'clang'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh all

      # -------------------------
      # Windows SDK + MSVC
      # -------------------------
      - name: Install Windows SDK
        if: runner.os == 'Windows'
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        with:
          sdk-version: 26100

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v3.0.1
        with:
          arch: x64

      # -------------------------
      # Configure CMake
      # -------------------------
      - name: Configure CMake
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
              if [[ "${{ matrix.c_compiler }}" == "clang" ]]; then
                  echo "Using Windows Clang with sccache"
                  LAUNCHER_OPTS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
              else
                  echo "Using MSVC (no caching)"
                  LAUNCHER_OPTS=""
              fi
              D3D12=ON
          else
              D3D12=OFF
              LAUNCHER_OPTS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          fi

          EXTRA_CXX_FLAGS=""
          if [[ "$RUNNER_OS" == "Linux" && "${{ matrix.c_compiler }}" == "clang" ]]; then
              EXTRA_CXX_FLAGS="-stdlib=libc++"
          fi

          cmake -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_CXX_FLAGS="${EXTRA_CXX_FLAGS}" \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            $LAUNCHER_OPTS \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_PLATFORM_D3D12=$D3D12 \
            -DNX_BUILD_TESTS=1 \
            -S .

      # -------------------------
      # Build
      # -------------------------
      - name: Build
        run: cmake --build build --target TestRunner

      # -------------------------
      # Print sccache stats (Linux)
      # -------------------------
      - name: sccache stats (Linux)
        if: runner.os == 'Linux'
        run: sccache --show-stats || true

      # -------------------------
      # Print sccache stats (Windows Clang)
      # -------------------------
      - name: sccache stats (Windows)
        if: runner.os == 'Windows' && matrix.c_compiler == 'clang'
        run: sccache --show-stats || true
