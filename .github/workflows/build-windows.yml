name: Build (Windows)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  build-windows:
    name: Build (Windows - ${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release
            vcpkg_triplet: x64-windows

          - name: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Debug
            vcpkg_triplet: x64-windows

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release
            vcpkg_triplet: x64-mingw-static

          - name: Clang
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug
            vcpkg_triplet: x64-mingw-static

          - name: Clang-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Release
            vcpkg_triplet: x64-windows

          - name: Clang-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Debug
            vcpkg_triplet: x64-windows

          - name: MinGW-UCRT
            c_compiler: ucrt64-w64-mingw32-gcc
            cpp_compiler: ucrt64-w64-mingw32-g++
            build_type: Release
            vcpkg_triplet: x64-mingw-static

          - name: MinGW-UCRT
            c_compiler: ucrt64-w64-mingw32-gcc
            cpp_compiler: ucrt64-w64-mingw32-g++
            build_type: Debug
            vcpkg_triplet: x64-mingw-static

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install LLVM (Clang-CL)
        if: matrix.c_compiler == 'clang-cl'
        run: choco install llvm

      - name: Install sccache
        run: choco install sccache

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\sccache
          key: sccache-windows-${{ matrix.c_compiler }}-${{ matrix.build_type }}
          restore-keys: |
            sccache-windows-${{ matrix.c_compiler }}

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Windows SDK
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        with:
          sdk-version: 26100

      - name: Setup MSVC
        if: matrix.name != 'MinGW-UCRT'
        uses: TheMrMilchmann/setup-msvc-dev@v3.0.1
        with:
          arch: x64

      - name: Install MinGW-UCRT (MSYS2)
        if: matrix.name == 'MinGW-UCRT' || matrix.name == 'Clang'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ffmpeg

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Remove rogue ccache from Strawberry Perl
        run: |
          if (Test-Path "C:\Strawberry\c\bin\ccache.exe") {
              Remove-Item "C:\Strawberry\c\bin\ccache.exe" -Force
          }


      - name: Configure CMake (MSVC/Clang-CL)
        if: matrix.name != 'MinGW-UCRT' && matrix.name != 'Clang'
        shell: bash
        run: |
          if [[ "${{ matrix.c_compiler }}" == "cl" ]]; then
              LAUNCHER_OPTS=""
          else
              LAUNCHER_OPTS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          fi

          cmake -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_PLATFORM_D3D12=ON \
            -DBUILD_TESTING=ON \
            $LAUNCHER_OPTS \
            -S .

      - name: Configure CMake (MSYS2 MinGW-UCRT)
        if: matrix.name == 'MinGW-UCRT' || matrix.name == 'Clang'
        shell: msys2 {0}
        run: |
          
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DBUILD_TESTING=ON \
            -S .

      - name: Build (MSVC/Clang-CL)
        if: matrix.name == 'MSVC' || matrix.name == 'Clang-CL'
        run: cmake --build build

      - name: Build (MSYS2)
        if: matrix.name == 'MinGW-UCRT' || matrix.name == 'Clang'
        shell: msys2 {0}
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build -C ${{matrix.build_type}} --output-on-failure --parallel

      - name: sccache stats
        run: sccache --show-stats || true
