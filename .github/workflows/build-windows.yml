name: Build (Windows)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  build-windows:
    name: Build (Windows - ${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: windows-latest

    env:
      SCCACHE_DIR: C:\Users\runneradmin\.cache\sccache
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: C:\Users\runneradmin\sccache-error.log
      SCCACHE_IDLE_TIMEOUT: 1200

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: MSVC,       c_compiler: cl,        cpp_compiler: cl,        build_type: Release }
          - { name: MSVC,       c_compiler: cl,        cpp_compiler: cl,        build_type: Debug }
          - { name: Clang-CL,   c_compiler: clang-cl,  cpp_compiler: clang-cl,  build_type: Release }
          - { name: Clang-CL,   c_compiler: clang-cl,  cpp_compiler: clang-cl,  build_type: Debug }
          - { name: Clang,      c_compiler: clang,     cpp_compiler: clang++,   build_type: Release }
          - { name: Clang,      c_compiler: clang,     cpp_compiler: clang++,   build_type: Debug }
          - { name: MinGW-UCRT, c_compiler: ucrt64-w64-mingw32-gcc, cpp_compiler: ucrt64-w64-mingw32-g++, build_type: Release }
          - { name: MinGW-UCRT, c_compiler: ucrt64-w64-mingw32-gcc, cpp_compiler: ucrt64-w64-mingw32-g++, build_type: Debug }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -------------------------
      # Restore sccache cache
      # -------------------------
      - name: Restore sccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-${{ hashFiles('**/*.cpp', '**/*.h') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Install LLVM (Clang-CL)
        if: matrix.name == 'Clang-CL'
        run: |
          choco install llvm
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Setup Ninja (Windows Ninja)
        if: matrix.name == 'MSVC' || matrix.name == 'Clang-CL'
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Windows SDK
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        with:
          sdk-version: 26100

      - name: Setup MSVC
        if: matrix.name == 'MSVC' || matrix.name == 'Clang-CL'
        uses: TheMrMilchmann/setup-msvc-dev@v3.0.1
        with:
          arch: x64

      # -------------------------
      # MSYS2 setup for MinGW + Clang
      # -------------------------
      - name: Install MinGW-UCRT (MSYS2)
        if: matrix.name == 'MinGW-UCRT' || matrix.name == 'Clang'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-flac


      - name: Remove rogue ccache
        run: |
          if (Test-Path "C:\Strawberry\c\bin\ccache.exe") {
            Remove-Item "C:\Strawberry\c\bin\ccache.exe" -Force
          }

      - name: Remove MSYS2 ccache
        if: matrix.name == 'MinGW-UCRT' || matrix.name == 'Clang'
        shell: msys2 {0}
        run: |
          which ccache && rm -f /usr/bin/ccache || true

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # -------------------------
      # Restore CPM.cmake dependency cache
      # -------------------------
      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: cpm-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-
            cpm-${{ runner.os }}-


      # -------------------------
      # Configure CMake (MSVC / Clang-CL)
      # -------------------------
      - name: Configure CMake (MSVC/Clang-CL)
        if: matrix.name == 'MSVC' || matrix.name == 'Clang-CL'
        shell: bash
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCPM_SOURCE_CACHE="${{ github.workspace }}/.cache" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_PLATFORM_D3D12=ON \
            -DBUILD_TESTING=ON \
            -S .

      # -------------------------
      # Configure CMake (MSYS2 MinGW / Clang)
      # -------------------------
      - name: Configure CMake (MSYS2)
        if: matrix.name == 'MinGW-UCRT' || matrix.name == 'Clang'
        shell: msys2 {0}
        run: |
          if [ "${{ matrix.name }}" = "Clang" ]; then
            export CC="$MINGW_PREFIX/bin/clang"
            export CXX="$MINGW_PREFIX/bin/clang++"
          else
            export CC="$MINGW_PREFIX/bin/gcc"
            export CXX="$MINGW_PREFIX/bin/g++"
          fi

          export PATH="$MINGW_PREFIX/bin:$PATH"

          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCPM_SOURCE_CACHE="${{ github.workspace }}/.cache" \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DBUILD_TESTING=ON \
            -S .

      # -------------------------
      # Build
      # -------------------------
      - name: Build (MSVC/Clang-CL)
        if: matrix.name == 'MSVC' || matrix.name == 'Clang-CL'
        run: cmake --build build

      - name: Build (MSYS2)
        if: matrix.name == 'MinGW-UCRT' || matrix.name == 'Clang'
        shell: msys2 {0}
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --parallel

      - name: sccache stats
        run: sccache --show-stats || true
