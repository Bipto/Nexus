name: Build (Windows)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  build-windows:
    name: Build (Windows - ${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: windows-latest

    env:
      SCCACHE_DIR: C:\Users\runneradmin\.cache\sccache
      SCCACHE_ERROR_LOG: C:\Users\runneradmin\sccache-error.log
      SCCACHE_IDLE_TIMEOUT: 1200

    strategy:
      fail-fast: false

      matrix:
        include:
          # -------------------------------------------------------
          # MSVC + MSVC STL
          # -------------------------------------------------------

          - name: MSVC
            environment: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

          - name: MSVC
            environment: MSVC
            c_compiler: cl
            cpp_compiler: cl
            build_type: Debug

          # -------------------------------------------------------
          # Clang-CL + MSVC STL
          # -------------------------------------------------------

          - name: Clang-CL
            environment: CLANG-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Release

          - name: Clang-CL
            environment: CLANG-CL
            c_compiler: clang-cl
            cpp_compiler: clang-cl
            build_type: Debug

          # -------------------------------------------------------
          # GCC + UCRT + libstdc++
          # -------------------------------------------------------

          - name: MinGW-UCRT
            environment: UCRT64
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

          - name: MinGW-UCRT
            environment: UCRT64
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Debug

          # -------------------------------------------------------
          # Clang + UCRT + libc++
          # -------------------------------------------------------

          - name: Clang
            environment: CLANG64
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

          - name: Clang
            environment: CLANG64
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug

    steps:
      # ===========================================================
      # Checkout
      # ===========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ===========================================================
      # Restore sccache cache
      # ===========================================================

      - name: Restore sccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: >-
            sccache-${{ runner.os }}-${{ matrix.environment }}-${{ matrix.name }}-${{ matrix.build_type }}-${{ hashFiles('**/*.cpp', '**/*.cc', '**/*.cxx', '**/*.c', '**/*.h', '**/*.hpp', '**/*.hxx') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ matrix.environment }}-${{ matrix.name }}-${{ matrix.build_type }}-
            sccache-${{ runner.os }}-${{ matrix.environment }}-${{ matrix.name }}-
            sccache-${{ runner.os }}-${{ matrix.environment }}-

      # ===========================================================
      # MSVC environment
      # ===========================================================

      - name: Setup MSVC
        if: matrix.environment == 'MSVC' || matrix.environment == 'CLANG-CL'
        uses: TheMrMilchmann/setup-msvc-dev@v3.0.1
        with:
          arch: x64

      - name: Setup Ninja
        if: matrix.environment == 'MSVC' || matrix.environment == 'CLANG-CL'
        uses: seanmiddleditch/gha-setup-ninja@v6

      # ===========================================================
      # sccache for MSVC / Clang-CL
      # ===========================================================

      - name: Setup sccache (MSVC / Clang-CL)
        if: matrix.environment == 'MSVC' || matrix.environment == 'CLANG-CL'
        uses: mozilla-actions/sccache-action@v0.0.4

      # ===========================================================
      # LLVM for Clang-CL
      # ===========================================================

      - name: Install LLVM (Clang-CL)
        if: matrix.environment == 'CLANG-CL'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress

          $llvmBin = "C:\Program Files\LLVM\bin"

          if (-not (Test-Path "$llvmBin\clang-cl.exe")) {
            throw "clang-cl.exe was not installed"
          }

          echo "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Append

          & "$llvmBin\clang-cl.exe" --version

      # ===========================================================
      # Windows SDK
      # ===========================================================

      - name: Install Windows SDK
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        with:
          sdk-version: 26100

      # ===========================================================
      # MSYS2 - UCRT64
      # ===========================================================

      - name: Setup MSYS2 UCRT64
        if: matrix.environment == 'UCRT64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sccache
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-flac

      # ===========================================================
      # MSYS2 - CLANG64
      # ===========================================================

      - name: Setup MSYS2 CLANG64
        if: matrix.environment == 'CLANG64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-libc++abi
            mingw-w64-clang-x86_64-libunwind
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-sccache
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-flac

      # ===========================================================
      # Verify MSYS2 toolchain
      # ===========================================================

      - name: Show MSYS2 toolchain
        if: matrix.environment == 'UCRT64' || matrix.environment == 'CLANG64'
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          export PATH="$MINGW_PREFIX/bin:$PATH"

          echo "========================================"
          echo "MSYSTEM"
          echo "========================================"
          echo "$MSYSTEM"

          echo "========================================"
          echo "MINGW_PREFIX"
          echo "========================================"
          echo "$MINGW_PREFIX"

          echo "========================================"
          echo "PATH"
          echo "========================================"
          echo "$PATH"

          echo "========================================"
          echo "Compiler locations"
          echo "========================================"
          which gcc || true
          which g++ || true
          which clang || true
          which clang++ || true
          which cmake
          which ninja
          which sccache

          echo "========================================"
          echo "Compiler versions"
          echo "========================================"
          gcc --version || true
          g++ --version || true
          clang --version || true
          clang++ --version || true

          echo "========================================"
          echo "CMake / Ninja"
          echo "========================================"
          cmake --version
          ninja --version

          echo "========================================"
          echo "sccache"
          echo "========================================"
          sccache --version

          echo "========================================"
          echo "Relevant MSYS2 packages"
          echo "========================================"
          pacman -Q | grep -E \
            '(^mingw-w64-(ucrt|clang)-x86_64-(gcc|clang|libc\+\+|libc\+\+abi|libunwind|sccache|cmake|ninja))' \
            || true

      # ===========================================================
      # Verify standard library
      # ===========================================================

      - name: Verify standard library
        if: matrix.environment == 'UCRT64' || matrix.environment == 'CLANG64'
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          export PATH="$MINGW_PREFIX/bin:$PATH"

          echo "========================================"
          echo "C++ standard library"
          echo "========================================"

          if [ "$MSYSTEM" = "UCRT64" ]; then
            echo "Expected: libstdc++"

            test -d "$MINGW_PREFIX/include/c++"

            find "$MINGW_PREFIX" \
              \( -name 'libstdc++*.dll' -o -name 'libstdc++*.a' \) \
              -print || true
          fi

          if [ "$MSYSTEM" = "CLANG64" ]; then
            echo "Expected: libc++"

            test -f "$MINGW_PREFIX/include/c++/v1/format"

            find "$MINGW_PREFIX" \
              \( -name 'libc++*.dll' \
              -o -name 'libc++*.a' \
              -o -name 'libunwind*.dll' \
              -o -name 'libunwind*.a' \) \
              -print || true
          fi

      # ===========================================================
      # Remove rogue Strawberry ccache
      # ===========================================================

      - name: Remove rogue ccache
        shell: pwsh
        run: |
          if (Test-Path "C:\Strawberry\c\bin\ccache.exe") {
            Remove-Item "C:\Strawberry\c\bin\ccache.exe" -Force
          }

      # ===========================================================
      # Vulkan
      # ===========================================================

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # ===========================================================
      # CPM cache
      # ===========================================================

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: >-
            cpm-${{ runner.os }}-${{ matrix.environment }}-${{ matrix.name }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ matrix.environment }}-${{ matrix.name }}-${{ matrix.build_type }}-
            cpm-${{ runner.os }}-${{ matrix.environment }}-${{ matrix.name }}-
            cpm-${{ runner.os }}-${{ matrix.environment }}-

      # ===========================================================
      # Configure CMake: MSVC / Clang-CL
      # ===========================================================

      - name: Configure CMake (MSVC / Clang-CL)
        if: matrix.environment == 'MSVC' || matrix.environment == 'CLANG-CL'
        shell: bash
        run: |
          set -euxo pipefail

          cmake -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER="${{ matrix.c_compiler }}" \
            -DCMAKE_CXX_COMPILER="${{ matrix.cpp_compiler }}" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCPM_SOURCE_CACHE="${{ github.workspace }}/.cache" \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DNX_PLATFORM_D3D12=ON \
            -DBUILD_TESTING=ON \
            -S .

      # ===========================================================
      # Configure CMake: MSYS2
      #
      # IMPORTANT:
      #
      # CLANG64 deliberately does NOT use sccache here while we
      # diagnose std::format/runtime issues.
      #
      # Once CLANG64 is proven stable, sccache can be re-enabled.
      # ===========================================================

      - name: Configure CMake (MSYS2)
        if: matrix.environment == 'UCRT64' || matrix.environment == 'CLANG64'
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          export PATH="$MINGW_PREFIX/bin:$PATH"

          if [ "$MSYSTEM" = "UCRT64" ]; then
            export CC=gcc
            export CXX=g++
          elif [ "$MSYSTEM" = "CLANG64" ]; then
            export CC=clang
            export CXX=clang++
          else
            echo "Unexpected MSYSTEM: $MSYSTEM"
            exit 1
          fi

          echo "========================================"
          echo "Compiler"
          echo "========================================"

          echo "MSYSTEM=$MSYSTEM"
          echo "MINGW_PREFIX=$MINGW_PREFIX"
          echo "CC=$CC"
          echo "CXX=$CXX"

          "$CC" --version
          "$CXX" --version

          echo "========================================"
          echo "C++ include search paths"
          echo "========================================"

          "$CXX" \
            -std=c++20 \
            -E -v \
            -x c++ \
            /dev/null \
            >/dev/null

          echo "========================================"
          echo "CMake"
          echo "========================================"

          if [ "$MSYSTEM" = "CLANG64" ]; then
            # Do NOT explicitly add -stdlib=libc++.
            # CLANG64 is already configured around libc++.
            cmake -B build \
              -G Ninja \
              -DCMAKE_C_COMPILER="$CC" \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
              -DCPM_SOURCE_CACHE="${{ github.workspace }}/.cache" \
              -DNX_PLATFORM_OPENGL=1 \
              -DNX_PLATFORM_VULKAN=1 \
              -DNX_PLATFORM_OPENAL=1 \
              -DBUILD_TESTING=ON \
              -S .
          else
            cmake -B build \
              -G Ninja \
              -DCMAKE_C_COMPILER="$CC" \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
              -DCPM_SOURCE_CACHE="${{ github.workspace }}/.cache" \
              -DNX_PLATFORM_OPENGL=1 \
              -DNX_PLATFORM_VULKAN=1 \
              -DNX_PLATFORM_OPENAL=1 \
              -DBUILD_TESTING=ON \
              -S .
          fi

      # ===========================================================
      # Show CMake compiler configuration
      # ===========================================================

      - name: Show CMake compiler configuration
        shell: pwsh
        run: |
          Write-Host "===== CMake compiler configuration ====="

          if (Test-Path build/CMakeCache.txt) {
            Select-String -Path build/CMakeCache.txt `
              -Pattern `
                "CMAKE_C_COMPILER:FILEPATH|CMAKE_CXX_COMPILER:FILEPATH|CMAKE_CXX_COMPILER_ID|CMAKE_CXX_COMPILER_VERSION|CMAKE_CXX_FLAGS"
          }

      # ===========================================================
      # Build: MSVC / Clang-CL
      # ===========================================================

      - name: Build (MSVC / Clang-CL)
        if: matrix.environment == 'MSVC' || matrix.environment == 'CLANG-CL'
        run: |
          cmake --build build --parallel

      # ===========================================================
      # Build: MSYS2
      # ===========================================================

      - name: Build (MSYS2)
        if: matrix.environment == 'UCRT64' || matrix.environment == 'CLANG64'
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          export PATH="$MINGW_PREFIX/bin:$PATH"

          cmake --build build --parallel "$(nproc)"

      # ===========================================================
      # CLANG64 std::format smoke test
      #
      # This isolates libc++/std::format from the project itself.
      # ===========================================================

      - name: Test std::format (CLANG64)
        if: matrix.environment == 'CLANG64'
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          export PATH="$MINGW_PREFIX/bin:$PATH"

          cat > /tmp/format-test.cpp <<'EOF'
          #include <format>
          #include <iostream>
          #include <string>

          int main() {
              std::string s = std::format("hello {}", 42);
              std::cout << s << '\n';
              return 0;
          }
          EOF

          echo "========================================"
          echo "Compiling std::format smoke test"
          echo "========================================"

          clang++ \
            -std=c++20 \
            /tmp/format-test.cpp \
            -o /tmp/format-test.exe

          echo "========================================"
          echo "Runtime dependencies"
          echo "========================================"

          ldd /tmp/format-test.exe

          echo "========================================"
          echo "Running std::format smoke test"
          echo "========================================"

          timeout 30s /tmp/format-test.exe

      # ===========================================================
      # Inspect project executable dependencies
      #
      # Particularly useful for CLANG64.
      # ===========================================================

      - name: Inspect CLANG64 runtime dependencies
        if: matrix.environment == 'CLANG64'
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          export PATH="$MINGW_PREFIX/bin:$PATH"

          echo "========================================"
          echo "CLANG64 runtime libraries"
          echo "========================================"

          find "$MINGW_PREFIX/bin" \
            \( -iname 'libc++*.dll' \
            -o -iname 'libc++abi*.dll' \
            -o -iname 'libunwind*.dll' \) \
            -print

          echo "========================================"
          echo "Project executables"
          echo "========================================"

          find build \
            -type f \
            -iname '*.exe' \
            -print | head -50

          echo "========================================"
          echo "Executable dependencies"
          echo "========================================"

          while IFS= read -r exe; do
            echo
            echo "----------------------------------------"
            echo "$exe"
            echo "----------------------------------------"
            ldd "$exe" || true
          done < <(find build -type f -iname '*.exe' | head -20)

      # ===========================================================
      # Run tests: MSVC / Clang-CL
      # ===========================================================

      - name: Run tests (MSVC / Clang-CL)
        if: matrix.environment == 'MSVC' || matrix.environment == 'CLANG-CL'
        shell: pwsh
        run: |
          ctest `
            --test-dir build `
            -C "${{ matrix.build_type }}" `
            --output-on-failure `
            --parallel

      # ===========================================================
      # Run tests: MSYS2
      #
      # IMPORTANT:
      # Keep execution inside the same MSYS2 environment used to
      # build the binaries, so libc++, libc++abi, libunwind, UCRT,
      # etc. are found consistently.
      # ===========================================================

      - name: Run tests (MSYS2)
        if: matrix.environment == 'UCRT64' || matrix.environment == 'CLANG64'
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          export PATH="$MINGW_PREFIX/bin:$PATH"

          ctest \
            --test-dir build \
            -C "${{ matrix.build_type }}" \
            --output-on-failure \
            --parallel "$(nproc)"

      # ===========================================================
      # sccache statistics
      # ===========================================================

      - name: sccache stats (MSVC / Clang-CL)
        if: matrix.environment == 'MSVC' || matrix.environment == 'CLANG-CL'
        shell: pwsh
        run: |
          sccache --show-stats
          exit 0

      - name: sccache stats (UCRT64)
        if: matrix.environment == 'UCRT64'
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          export PATH="$MINGW_PREFIX/bin:$PATH"

          sccache --show-stats || true