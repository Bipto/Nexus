name: Generate Doxygen Docs (HTML + PDF)

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Install LaTeX (for PDF generation)
        run: sudo apt-get install -y texlive texlive-latex-extra texlive-fonts-recommended

      - name: Run Doxygen
        run: doxygen Doxyfile

      - name: Build PDF from LaTeX
        working-directory: docs/latex
        run: |
          make
          ls -l refman.pdf

      # Upload HTML output for GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

      # Optional: upload PDF separately as a normal artifact
      - name: Upload PDF docs
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-pdf
          path: docs/latex/refman.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
