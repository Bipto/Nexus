name: Build (Linux)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  build-linux:
    name: Build (Linux - ${{ matrix.name }} - ${{ matrix.build_type }})
    runs-on: ubuntu-24.04

    env:
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_ERROR_LOG: /home/runner/sccache-error.log
      SCCACHE_IDLE_TIMEOUT: 1200

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: GCC,   c_compiler: gcc,   cpp_compiler: g++,      build_type: Release, vcpkg_triplet: x64-linux }
          - { name: GCC,   c_compiler: gcc,   cpp_compiler: g++,      build_type: Debug,   vcpkg_triplet: x64-linux }
          - { name: Clang, c_compiler: clang, cpp_compiler: clang++,  build_type: Release, vcpkg_triplet: x64-linux }
          - { name: Clang, c_compiler: clang, cpp_compiler: clang++,  build_type: Debug,   vcpkg_triplet: x64-linux }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -------------------------
      # Restore sccache cache
      # -------------------------
      - name: Restore sccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-${{ hashFiles('**/*.cpp', '**/*.h') }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-

      - name: Cache apt
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt
            /var/lib/apt/lists
          key: apt-${{ runner.os }}-24.04

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev mesa-common-dev \
            libx11-dev xorg-dev \
            build-essential nasm autoconf autoconf-archive automake libtool libltdl-dev

      - name: Install GTK3
        run: sudo apt-get install -y libgtk-3-dev


      - name: Install Clang 21
        if: matrix.name == 'Clang'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      # -------------------------
      # Restore CPM.cmake dependency cache
      # -------------------------
      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: cpm-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-
            cpm-${{ runner.os }}-


      # -------------------------
      # Configure CMake
      # -------------------------
      - name: Configure CMake
        run: |
          if [ "${{ matrix.name }}" = "Clang" ]; then
            export CC=clang-21
            export CXX=clang++-21
          else
            export CC=${{ matrix.c_compiler }}
            export CXX=${{ matrix.cpp_compiler }}
          fi

          cmake -B build \
            -G Ninja \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCPM_SOURCE_CACHE="${{ github.workspace }}/.cache" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DNX_PLATFORM_OPENGL=1 \
            -DNX_PLATFORM_VULKAN=1 \
            -DNX_PLATFORM_OPENAL=1 \
            -DBUILD_TESTING=ON \
            -S .

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel

      - name: sccache stats
        run: sccache --show-stats || true
