name: Static Analysis

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fix apt mirror sync issues
        run: |
          sudo apt-get clean
          sudo apt-get update --allow-releaseinfo-change
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::No-Cache=True

      - name: Install Linux dependencies
        run: |
          sudo apt-get install -y \
            libgl1-mesa-dev mesa-utils mesa-common-dev \
            libx11-dev xserver-xorg-dev xorg-dev \
            build-essential nasm autoconf autoconf-archive automake libtool

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cppcheck

      - name: vcpkg build
        id: vcpkg
        uses: johnwason/vcpkg-action@v7
        with:
          manifest-dir: ${{ github.workspace }}
          triplet: ${{ matrix.vcpkg_triplet }}
          token: ${{ github.token }}
          cache-key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ matrix.build_type }}

      - name: Configure project
        run: cmake -S . -B build \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DNX_PLATFORM_OPENGL=1 \
          -DNX_PLATFORM_VULKAN=1 \
          -DNX_PLATFORM_OPENAL=1 \

      - name: Run clang-tidy
        run: clang-tidy -p build $(find src -name '*.cpp')

      - name: Run cppcheck
        run: cppcheck --enable=all --inconclusive --error-exitcode=1 src/
