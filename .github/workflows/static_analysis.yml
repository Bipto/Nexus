name: Static Analysis

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  analysis:
    runs-on: ubuntu-latest

  strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Debug
            vcpkg_triplet: x64-linux

  steps:
    - uses: actions/checkout@v4

    - name: Fix apt mirror sync issues
      run: |
        sudo apt-get clean
        sudo apt-get update --allow-releaseinfo-change
        sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::No-Cache=True

    - name: Install Linux dependencies
      run: |
        sudo apt-get install -y \
          libgl1-mesa-dev mesa-utils mesa-common-dev \
          libx11-dev xserver-xorg-dev xorg-dev \
          build-essential nasm autoconf autoconf-archive automake libtool libltdl-dev

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy cppcheck

    - name: Install sccache
      run: sudo apt-get install -y sccache

    - name: Cache sccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/sccache
        key: sccache-linux-${{ matrix.c_compiler }}-${{ matrix.build_type }}
        restore-keys: |
          sccache-linux-${{ matrix.c_compiler }}

    - name: vcpkg build
      id: vcpkg
      uses: johnwason/vcpkg-action@v7
      with:
        manifest-dir: ${{ github.workspace }}
        triplet: ${{ matrix.vcpkg_triplet }}
        token: ${{ github.token }}
        cache-key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{  matrix.c_compiler  }}-${{ matrix.build_type }}

    - name: Configure CMake
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DNX_PLATFORM_OPENGL=1 \
          -DNX_PLATFORM_VULKAN=1 \
          -DNX_PLATFORM_OPENAL=1 \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -S .

    - name: Run clang-tidy
      run: clang-tidy -p build $(find src -name '*.cpp')

    - name: Run cppcheck
      run: cppcheck --enable=all --inconclusive --error-exitcode=1 src/
