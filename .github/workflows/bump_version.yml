name: Post-merge Version Bump

on:
  push:
    branches:
      - main

jobs:
  bump_version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find merged PR for this commit
        id: findpr
        run: |
          # 1) Try to read PR number from event payload (works for merge commits)
          pr=$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")

          # 2) If empty, try to extract PR number from commit message (works for squash merges)
          if [ -z "$pr" ]; then
            pr=$(git log -1 --pretty=%B | sed -n 's/.*(#\([0-9]\+\)).*/\1/p')
          fi

          # 3) If still empty, fallback to API lookup (works for merge commits with preserved SHAs)
          if [ -z "$pr" ]; then
            echo "Falling back to API lookup..."
            prs=$(gh api repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls --jq '.[0].number // empty')
            pr="$prs"
          fi

          # 4) If still empty, fail
          if [ -z "$pr" ]; then
            echo "::error::No PR associated with commit ${GITHUB_SHA}"
            exit 1
          fi

          echo "pr_number=$pr" >> "$GITHUB_OUTPUT"


      - name: Get PR Body
        id: prbody
        uses: actions/github-script@v7
        with:
          script: |
            const pr_number = ${{ steps.findpr.outputs.pr_number }};
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });
            core.setOutput('body', pr.body || '');

      - name: Determine version bump
        id: bump
        run: |
          body="${{ steps.prbody.outputs.body }}"

          major=$(printf '%s\n' "$body" | grep -Ei '^\s*-\s*\[[xX]\]\s*major' | wc -l)
          minor=$(printf '%s\n' "$body" | grep -Ei '^\s*-\s*\[[xX]\]\s*minor' | wc -l)
          patch=$(printf '%s\n' "$body" | grep -Ei '^\s*-\s*\[[xX]\]\s*patch' | wc -l)
          sum=$((major + minor + patch))

          if [ "$sum" -gt 1 ]; then
            echo "::error::More than one version bump selected!"
            exit 1
          fi

          if [ "$major" -eq 1 ]; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
          elif [ "$minor" -eq 1 ]; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          else
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version in version.txt
        id: version
        run: |
          file="version.txt"

          if [ ! -f "$file" ]; then
            echo "::error::version.txt not found"
            exit 1
          fi

          ver=$(cat "$file" | tr -d '[:space:]')
          if ! echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version.txt does not contain a valid semantic version (got: '$ver')"
            exit 1
          fi

          IFS=. read -r major minor patch <<<"$ver"
          bumptype="${{ steps.bump.outputs.bump }}"

          if [ "$bumptype" = "major" ]; then
            major=$((major + 1))
            minor=0
            patch=0
          elif [ "$bumptype" = "minor" ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          newver="${major}.${minor}.${patch}"
          echo "$newver" > "$file"

          echo "newver=$newver" >> "$GITHUB_OUTPUT"
          echo "version bumped, $ver -> $newver"

      - name: Commit and push version change
        run: |
          git add version.txt
          if git diff --cached --quiet; then
            echo "No version change"
          else
            git commit -m "ci: bump version to ${{ steps.version.outputs.newver }}"
            git push
          fi

      - name: Create and push tag
        if: steps.version.outputs.newver != ''
        run: |
          tag="v${{ steps.version.outputs.newver }}"
          git tag "$tag"
          git push origin "$tag"

